name: Sync latest videos & blog posts

# Keeps data/*.json fresh from April's public YouTube channel feed,
# speaking playlist, and blog RSS feed (see scripts/fetch-feeds.mjs — both are free, keyless
# endpoints, no API keys or secrets involved). A commit here to main
# triggers a GitHub Pages rebuild automatically.

on:
  schedule:
    - cron: "0 13 * * *" # once a day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-feeds
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest videos & posts
        id: fetch
        continue-on-error: true
        env:
          # Optional. Add a YT_API_KEY repository secret for the most reliable playlist sync.
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/fetch-feeds.mjs

      - name: Commit updated data if changed
        run: |
          if git diff --quiet -- data/; then
            echo "No changes to feed data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: sync latest videos & blog posts"
          git push

      - name: Flag a partial sync
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::One or more feeds failed. Whatever did sync was saved; the rest kept its last good copy. See the fetch step log."
          exit 1
